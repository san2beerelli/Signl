name: Release macOS Beta

# Builds, signs, and notarizes the Mac app, then publishes the .dmg as a
# GitHub prerelease. Runs on a macOS runner since signing/notarization
# require Apple's own tooling. Needs these repo secrets (Settings ->
# Secrets and variables -> Actions) to actually sign/notarize:
#   CSC_LINK                    base64-encoded Developer ID Application .p12
#                                (generate with: openssl base64 -in cert.p12)
#   CSC_KEY_PASSWORD             password used when exporting that .p12
#   APPLE_ID                     Apple ID email for notarization
#   APPLE_APP_SPECIFIC_PASSWORD  app-specific password from appleid.apple.com
#   APPLE_TEAM_ID                Apple Developer Team ID
#
# Without those secrets set, this workflow builds an unsigned app and the
# notarize/codesign steps will fail - it's not meant to run green until
# they're configured.

on:
  push:
    tags:
      - "v*-beta*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: |
          npm run typecheck:main
          npm run typecheck:renderer
          npx tsc --noEmit -p src/preload/tsconfig.json

      - name: Build renderer/main/preload bundles
        run: npm run build

      - name: Package, sign, and notarize the macOS app
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run package:mac

      - name: Publish beta release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.dmg
          prerelease: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
